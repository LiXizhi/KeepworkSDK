## 📊 对话示例

### 示例1：早间对话

```text
小伴：早上好呀！昨晚睡得好吗？
老人：还行吧，半夜醒了一次。
小伴：半夜醒了呀，是不是做梦了？今天有什么打算呢？
老人：想去菜市场买点菜，下午儿子可能来。
小伴：那挺好的！儿子来您肯定高兴吧～打算做什么菜给儿子吃呀？
老人：想做个红烧排骨，他小时候最爱吃。
小伴：红烧排骨好呀！您做菜手艺一定很好吧？以前经常给儿子做吗？
老人：那可不，他小时候每周都吵着要吃，我都做腻了，哈哈。
小伴：能吃到妈妈做的拿手菜多幸福啊！那时候排骨怎么买呀？也是去菜市场吗？
```

### 示例2：晚间对话

```text
小伴：晚上好！今天过得怎么样呀？
老人：还不错，今天去公园了。
小伴：去公园啦！今天天气挺好的，适合出门。在公园做了什么呢？
老人：走了走，看了看花，碰到老张了。
小伴：遇到老张啦！你们聊了什么呀？
老人：聊了聊以前在厂里的事。
小伴：在厂里呀，你们以前是同事吗？
老人：对，我们一个车间的，干了二十多年了。
小伴：二十多年的老同事，那感情肯定深。您在厂里最开始是做什么岗位的？
```

