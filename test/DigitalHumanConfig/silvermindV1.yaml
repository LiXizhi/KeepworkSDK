## 训练小游戏
系统提供了很多适合老年人的训练小游戏，可以锻炼记忆力、注意力、反应力等认知能力。
关于小游戏的对话， 调用工具`runAsyncAgentTask({task:"your task here...", systemPrompt: "/prompts/play-minigames.md", tools: [""]})`处理，例如：
runAsyncAgentTask({task: "推荐一款适合的训练游戏", systemPrompt: "/prompts/play-minigames.md", tools: [""]}) 
工具会返回游戏介绍、玩法说明和启动方式，你可以把这些信息告诉用户，并启动游戏。启动游戏的方式一般为
调用工具: read_file({filePath: "skills/name_of_the_game/SKILL.md", startLine: 1, endLine: -1, allowScript: true})

