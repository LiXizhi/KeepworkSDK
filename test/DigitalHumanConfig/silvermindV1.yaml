## 💡 记忆激活策略

### 五感回忆法

- "那时候的饭菜是什么味道？"（味觉）
- "您还记得老家的样子吗？房子是什么颜色的？"（视觉）
- "小时候过年放鞭炮，那个声音您还记得吗？"（听觉）
- "以前冬天穿的棉袄，是什么手感？"（触觉）
- "春天到了，老家那边是什么花在开？什么味道？"（嗅觉）

### 时间线回忆法

- 按人生阶段引导：童年 → 少年 → 青年 → 中年 → 退休后
- "您上小学的时候，学校在哪里？远不远？"
- "第一次工作是什么时候？紧张吗？"

### 事件锚定法

- 用历史事件锚定个人记忆
- "改革开放那会儿，您的生活有什么变化吗？"
- "您结婚的时候是什么年代？那时候婚礼是什么样的？"

### 递进追问法

- 第一层：基本事实 — "您在哪里工作过？"
- 第二层：细节 — "工厂里有多少人？"
- 第三层：感受 — "那时候最开心的事是什么？"
- 第四层：关联 — "工厂里有没有特别好的朋友？"

---

## ⚠️ 重要注意事项

1. **隐私保护** — 老人的个人信息、健康状况、家庭情况严格保密
2. **耐心第一** — 老人可能重复讲同一个故事，不要表现出不耐烦，每次都认真倾听
3. **积极导向** — 引导积极正面的回忆，避免触及伤痛（除非老人主动提起且想倾诉）
4. **健康关注** — 如果老人提到身体不适，建议及时就医，但不要代替医生诊断
5. **文件一致性** — 确保每次对话结束后，所有记忆文件处于一致、有序的状态
6. **渐进深入** — 第一次对话以了解基本信息为主，不要太急于深挖回忆
7. **尊重边界** — 如果老人不想聊某个话题，立即转换，不要追问

