<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gemini Chat</title>
<script src="https://cdn.keepwork.com/keepwork/cdn/tailwindcss@3.4.16.js"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">
  <div class="p-3 bg-gray-800 flex flex-col gap-2 shrink-0">
    <div class="flex gap-2">
      <input id="apiKey" type="password" placeholder="API Key" class="flex-1 px-3 py-2 rounded bg-gray-700 text-sm">
    </div>
    <div class="flex gap-2 items-center">
      <select id="modelSelect" class="flex-1 px-3 py-2 rounded bg-gray-700 text-sm">
        <option value="gemini-3.1-pro-preview" selected>Gemini 3.1 Pro (Preview)</option>
        <option value="gemini-3-flash-preview">Gemini 3 Flash (Preview)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
        <option value="custom">Custom...</option>
      </select>
      <input id="customModel" type="text" placeholder="Custom model name" class="hidden flex-1 px-3 py-2 rounded bg-gray-700 text-sm">
    </div>
  </div>

  <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

  <form id="form" class="p-3 bg-gray-800 flex gap-2 shrink-0">
    <input id="msg" type="text" placeholder="Type a message..." class="flex-1 px-4 py-2 rounded-full bg-gray-700 text-sm" autocomplete="off">
    <button class="bg-blue-600 px-5 py-2 rounded-full text-sm font-semibold hover:bg-blue-500">Send</button>
  </form>

<script>
const API_KEY_STORAGE_KEY='testAIChatGemini.apiKey';
const chat=document.getElementById('chat'),form=document.getElementById('form'),msg=document.getElementById('msg');
const apiKeyInput=document.getElementById('apiKey');
const modelSelect=document.getElementById('modelSelect'),customModel=document.getElementById('customModel');
const history=[];

apiKeyInput.value=localStorage.getItem(API_KEY_STORAGE_KEY)||'';
apiKeyInput.addEventListener('input',()=>{
  localStorage.setItem(API_KEY_STORAGE_KEY,apiKeyInput.value);
});

modelSelect.addEventListener('change',()=>{
  customModel.classList.toggle('hidden',modelSelect.value!=='custom');
});

function getModel(){
  return modelSelect.value==='custom'?customModel.value.trim():modelSelect.value;
}

function addBubble(role,text){
  const d=document.createElement('div');
  d.className=role==='user'?'ml-auto bg-blue-600 rounded-2xl px-4 py-2 max-w-xs text-sm whitespace-pre-wrap'
    :'mr-auto bg-gray-700 rounded-2xl px-4 py-2 max-w-xs text-sm whitespace-pre-wrap';
  d.textContent=text; chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
  return d;
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=msg.value.trim(); if(!text)return; msg.value='';
  const key=apiKeyInput.value.trim();
  const model=getModel();
  if(!key){addBubble('bot','⚠️ Please enter your API key.');return;}
  if(!model){addBubble('bot','⚠️ Please enter a model name.');return;}
  localStorage.setItem(API_KEY_STORAGE_KEY,key);

  addBubble('user',text);
  history.push({role:'user',parts:[{text}]});
  const bubble=addBubble('bot','...');

  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:history})
    });
    const d=await r.json();
    if(d.error){bubble.textContent='Gemini: '+JSON.stringify(d.error);return;}
    const reply=d.candidates?.[0]?.content?.parts?.[0]?.text||'(no response)';
    bubble.textContent=reply;
    history.push({role:'model',parts:[{text:reply}]});
  }catch(err){bubble.textContent='Error: '+err.message;}
});
</script>
</body>
</html>
