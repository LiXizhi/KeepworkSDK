<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; }
    #viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script type="module">
    try { await import('../index.ts'); } catch (e) { await import('../dist/keepworkSDK.iife.js'); }
    const { createWorkspaceViewer } = await import('../src/ui/WorkspaceViewer.ts');

    const params = new URLSearchParams(window.location.search);
    createWorkspaceViewer({
      container: document.getElementById('viewer'),
      workspace: params.get('workspace') || 'workspace_default',
      mountFolder: params.get('mountFolder') || '',
      file: params.get('file') || '',
      hideTopbar: params.get('hideTopbar') === '1',
      hideToolbar: params.get('hideToolbar') === '1',
      compact: params.get('compact') === '1',
    });
  </script>
</body>
</html>
