<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
}
#dh-container {
  width: 100%; height: 100%;
}
</style>
</head>
<body>
<div id="dh-container"></div>
<script>
/**
 * DigitalHumanFrame.html — Static fallback for environments where iframe srcdoc
 * is not supported (e.g. WeChat iOS browser).
 *
 * Expects:
 *   Query params: ?sdk=<sdkUrl>
 *   Hash params:  #parentAgent=<agentName>&module=1  (module=1 for ES modules)
 *
 * Behaviour is identical to the inline srcdoc generated by DigitalHumanFrame.js.
 */
(function() {

const params = new URLSearchParams(window.location.search);
const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const PARENT_AGENT = hashParams.get('parentAgent') || '';
const PARENT_TOKEN = hashParams.get('token') || '';
const PARENT_USER_API_KEY = hashParams.get('userApiKey') || '';
const PARENT_BASE_URL = hashParams.get('baseURL') || '';
const SDK_SRC = params.get('sdk') || '';
const IS_MODULE = hashParams.get('module') === '1';
const MSG_PREFIX = 'dh-frame:';

// Propagate parent SDKLogger config: suppress SDK console output
if (hashParams.get('sdklog') === '0') {
  window.__sdkLogConfig = { globalEnabled: false };
}

let dh = null;
let sdk = null;

// ── Load the SDK script dynamically ──

function loadScript(src, isModule) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    if (isModule) s.type = 'module';
    s.crossOrigin = 'anonymous';
    s.src = src;
    s.onload = function() {
      if (isModule) {
        // ES module scripts can finish loading before their dependency graph
        // has completed evaluation. Poll globals before resolving so the
        // bootstrap is robust in Vite dev mode.
        waitForSdkGlobals().then(resolve, reject);
      } else {
        resolve();
      }
    };
    s.onerror = function() { reject(new Error('Failed to load SDK: ' + src)); };
    document.head.appendChild(s);
  });
}

// ── PostMessage bridge (iframe side) ──

function postToParent(msg) {
  window.parent.postMessage(msg, '*');
}

function waitForSdkGlobals(timeoutMs) {
  timeoutMs = timeoutMs || 10000;
  var start = Date.now();
  return new Promise(function(resolve, reject) {
    var check = function() {
      if (typeof window.KeepworkSDK === 'function' && typeof window.DigitalHuman === 'function') {
        resolve();
        return;
      }
      if (Date.now() - start >= timeoutMs) {
        reject(new Error('DigitalHumanFrame iframe bootstrap timed out waiting for SDK globals'));
        return;
      }
      setTimeout(check, 30);
    };
    check();
  });
}

function setupToolProxy(cfg) {
  if (!cfg.tools) cfg.tools = {};

  var parentDefs = cfg._parentToolDefs;
  if (parentDefs && sdk && sdk.copilotTools) {
    var catNames = Object.keys(parentDefs);
    for (var i = 0; i < catNames.length; i++) {
      var catName = catNames[i];
      if (!sdk.copilotTools._registry[catName]) {
        sdk.copilotTools.registerToolCategory(catName, {
          definitions: parentDefs[catName],
          executor: function() { return Promise.reject(new Error('Tool proxied to parent')); }
        });
      }
    }
  }

  var cats = cfg._proxyCategories || ['read', 'edit', 'search', 'app', 'execute', 'web', 'mqtt', 'personalPage', 'agent', 'minigame'];
  var proxyCats = {};
  for (var j = 0; j < cats.length; j++) proxyCats[cats[j]] = true;
  proxyCats['read'] = true;
  proxyCats['edit'] = true;
  // minigame overlay always lives on the parent window
  proxyCats['minigame'] = true;

  var proxyCategories = {};
  var allCats = Object.keys(proxyCats);
  for (var k = 0; k < allCats.length; k++) {
    proxyCategories[allCats[k]] = { agent: PARENT_AGENT };
  }

  // Do NOT auto-enable proxy categories for the LLM here.
  // LLM-visible tools are strictly controlled by the user's `tools:` config.
  // Proxy routing (toolProxy.categories) handles execution delegation
  // independently — a category can be proxied without being exposed to the LLM.

  cfg.tools = Object.assign({}, cfg.tools, {
    toolProxy: { categories: proxyCategories }
  });

  delete cfg._parentToolDefs;
  delete cfg._proxyCategories;
}

async function createDH() {
  await waitForSdkGlobals();

  var DigitalHuman = window.DigitalHuman;
  var KeepworkSDK = window.KeepworkSDK;

  if (!window.keepwork) {
    window.keepwork = new KeepworkSDK();
  }
  if (PARENT_TOKEN) {
    window.keepwork.setToken(PARENT_TOKEN);
  }
  if (PARENT_USER_API_KEY && window.keepwork.setUserApiKey) {
    window.keepwork.setUserApiKey(PARENT_USER_API_KEY);
  }
  if (PARENT_BASE_URL) {
    window.keepwork.baseURL = PARENT_BASE_URL;
  }
  sdk = window.keepwork;

  dh = new DigitalHuman({
    sdk: sdk,
    container: document.getElementById('dh-container'),
  });

  dh.enableRemoteControl({
    msgPrefix: MSG_PREFIX,
    postToParent: postToParent,
    setupToolProxy: setupToolProxy,
    forwardUserVoiceInputViaParentFrame: true
  });
}

(async function() {
  try {
    if (SDK_SRC) {
      await loadScript(SDK_SRC, IS_MODULE);
    }
    await createDH();
    postToParent({ type: MSG_PREFIX + 'ready' });
  } catch (error) {
    console.error('[DigitalHumanFrame.html] bootstrap failed:', error);
    postToParent({
      type: MSG_PREFIX + 'event',
      event: 'error',
      data: {
        stage: 'bootstrap',
        message: error && error.message ? error.message : String(error),
      },
    });
  }
})();

})();
</script>
</body>
</html>
